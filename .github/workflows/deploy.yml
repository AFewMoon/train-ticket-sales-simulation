name: Deploy to GitHub Pages

# 只在 master 上动作：从 master 直接部署站点，不创建、不推送任何其他分支
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, test and build
        run: |
          npm run build
          npm test

      # 版本断言：产物必须内嵌 package.json 的版本号（构建期 define 注入）
      - name: Verify version marker in bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "$VERSION" dist/train-ticket-sales.js
          echo "bundle version ok: $VERSION"

      # 站点组装：按仓库根同构布局（index.html + css/ + dist/ 产物），
      # 使 index.html 中 css/style.css 与 dist/train-ticket-sales.js 的相对引用在线上原样成立
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp favicon.svg site/
          cp -r css site/css
          cp -r dist site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
